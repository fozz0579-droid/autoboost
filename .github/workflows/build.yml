      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Guncel Fabric surumlerini bul
        run: |
          MC=1.21.11
          YARN=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version' || true)
          LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[] | select(.stable==true)][0].version' || true)
          API=$(curl -fsSL -A "autoboost-build" "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number' || true)
          echo "yarn=$YARN loader=$LOADER api=$API"
          if [ -n "$YARN" ] && [ "$YARN" != "null" ]; then sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties; fi
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties; fi
          if [ -n "$API" ] && [ "$API" != "null" ]; then sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties; fi
          cat gradle.properties

      - name: Derle
        run: gradle build --no-daemon --stacktrace

      - name: Jar dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: autoboost-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
